[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "start-translate"
version = "0.1.0"
description = "StarT translation service: MinerU Markdown EN→ZH + PDF export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
  "Markdown>=3.4.0",
  "playwright>=1.40.0",
  "PyYAML>=6.0.0",
]

[project.scripts]
start-translate = "start_translate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
