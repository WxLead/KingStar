# StarT compose stack
# Usage (from repo root):
#   docker compose -f docker/docker-compose.yml up --build
#
# MinerU: use official/public image when available, or build from D:\desktop\MinerU.
# Dev without Docker MinerU: run mineru-api on host and set MINERU_API_URL.

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      MINERU_API_URL: ${MINERU_API_URL:-http://mineru-api:8000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      START_DATA_DIR: /data
    volumes:
      - start_data:/data
    depends_on:
      - mineru-api

  # Placeholder: point image to your MinerU build or override command.
  # Local alternative: comment this service out and run `mineru-api` on the host,
  # then set MINERU_API_URL=http://host.docker.internal:8000 for api.
  mineru-api:
    image: ${MINERU_IMAGE:-opendatalab/mineru:latest}
    profiles: ["mineru"]
    ports:
      - "8000:8000"
    command: ["mineru-api", "--host", "0.0.0.0", "--port", "8000"]
    # shm_size / gpus as needed for your deployment

volumes:
  start_data:
